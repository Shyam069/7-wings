<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Information | 7 WINGS</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        body {
            overflow-x: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 240px !important;
            height: 100vh !important;
            z-index: 1000 !important;
            display: flex !important;
            flex-direction: column !important;
            padding: 28px 18px !important;
            box-sizing: border-box !important;
            background: rgba(7, 15, 35, 0.96) !important;
            border-right: 1px solid rgba(255,255,255,0.08) !important;
            backdrop-filter: blur(18px) !important;
        }

        .sidebar .logo {
            text-align: left !important;
            margin-bottom: 35px !important;
            padding-left: 10px !important;
        }

        .sidebar .logo h2 {
            margin: 0 !important;
            color: white !important;
        }

        .sidebar .logo span {
            display: block !important;
            color: #38bdf8 !important;
            font-size: 12px !important;
            letter-spacing: 2px !important;
        }

        .sidebar nav {
            display: flex !important;
            flex-direction: column !important;
            gap: 6px !important;
        }

        .sidebar nav a {
            display: flex !important;
            align-items: center !important;
            min-height: 45px !important;
            padding: 0 15px !important;
            border-radius: 10px !important;
            color: rgba(255,255,255,0.68) !important;
            text-decoration: none !important;
            transition: 0.25s !important;
        }

        .sidebar nav a:hover {
            color: white !important;
            background: rgba(255,255,255,0.06) !important;
        }

        .sidebar nav a.active {
            color: white !important;
            background: linear-gradient(135deg,#2563eb,#7c3aed) !important;
        }

        /* MAIN */
        .main-content {
            margin-left: 240px !important;
            width: calc(100% - 240px) !important;
            min-height: 100vh !important;
            box-sizing: border-box !important;
            padding: 40px !important;
        }

        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .info-header h1 {
            margin: 0 0 7px;
        }

        .info-header p {
            margin: 0;
            opacity: 0.7;
        }

        .search-box {
            width: 100%;
            max-width: 380px;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
        }

        .category-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .category-btn,
        .refresh-btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.25s;
        }

        .category-btn:hover,
        .refresh-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .category-btn.active {
            background: linear-gradient(135deg,#2563eb,#7c3aed);
            border-color: transparent;
        }

        .refresh-btn {
            margin-left: auto;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
            gap: 20px;
        }

        .news-card {
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 22px;
            min-height: 245px;
            display: flex;
            flex-direction: column;
            transition: 0.25s;
        }

        .news-card:hover {
            transform: translateY(-4px);
            border-color: rgba(56,189,248,0.35);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .news-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .news-category {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 10px;
            background: rgba(59,130,246,0.15);
            color: #60a5fa;
        }

        .news-time {
            font-size: 12px;
            opacity: 0.55;
        }

        .news-card h3 {
            font-size: 18px;
            line-height: 1.4;
            margin: 0 0 10px;
        }

        .news-card p {
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.7;
            margin: 0 0 20px;
        }

        .news-bottom {
            margin-top: auto;
        }

        .read-btn {
            display: inline-block;
            padding: 9px 15px;
            border-radius: 10px;
            background: rgba(59,130,246,0.12);
            color: #60a5fa;
            text-decoration: none;
            font-size: 13px;
        }

        .read-btn:hover {
            background: #2563eb;
            color: white;
        }

        .status {
            margin: 15px 0;
            font-size: 13px;
            opacity: 0.65;
        }

        .no-results {
            text-align: center;
            padding: 50px 20px;
            opacity: 0.6;
            display: none;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: relative !important;
                width: 100% !important;
                height: auto !important;
            }

            .sidebar nav {
                flex-direction: row !important;
                overflow-x: auto !important;
            }

            .main-content {
                margin-left: 0 !important;
                width: 100% !important;
                padding: 25px 18px !important;
            }

            .news-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            <h2>7 WINGS</h2>
            <span>PLATFORM</span>
        </div>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="tasks.html">Task Manager</a>
            <a href="resume.html">Resume Builder</a>
            <a href="interview.html">Interview Prep</a>
            <a href="knowledge.html">AI Knowledge</a>
            <a href="calculator.html">Calculator</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="information.html" class="active">Information</a>
        </nav>

    </aside>


    <!-- MAIN -->
    <main class="main-content">

        <div class="info-header">

            <div>
                <h1>Stay informed.</h1>

                <p>
                    Live updates on technology, AI, education,
                    careers and opportunities.
                </p>
            </div>

            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search live information..."
                >
            </div>

        </div>


        <!-- CATEGORIES -->
        <div class="category-bar">

            <button class="category-btn active"
                    data-category="All">
                All
            </button>

            <button class="category-btn"
                    data-category="Technology">
                Technology
            </button>

            <button class="category-btn"
                    data-category="AI">
                AI
            </button>

            <button class="category-btn"
                    data-category="Education">
                Education
            </button>

            <button class="category-btn"
                    data-category="Career">
                Career
            </button>

            <button class="category-btn"
                    data-category="Hackathons">
                Hackathons
            </button>

            <button class="category-btn"
                    data-category="Science">
                Science
            </button>

            <button class="refresh-btn"
                    id="refreshBtn">
                🔄 Refresh
            </button>

        </div>


        <div class="status" id="status">
            Loading latest information...
        </div>


        <!-- NEWS -->
        <div class="news-grid" id="newsGrid"></div>


        <div class="no-results" id="noResults">
            <h3>No information found</h3>
            <p>Try another category or search.</p>
        </div>

    </main>


    <script>

        const API_URL = "/api/information/news";

        let currentCategory = "All";


        // ==============================================
        // LOAD NEWS
        // ==============================================

        async function loadNews() {

            const search =
                document
                    .getElementById("searchInput")
                    .value
                    .trim();

            const status =
                document.getElementById("status");

            const grid =
                document.getElementById("newsGrid");

            const noResults =
                document.getElementById("noResults");


            status.textContent =
                "Loading latest information...";

            noResults.style.display = "none";


            try {

                let url =
                    `${API_URL}?category=${encodeURIComponent(currentCategory)}`;


                if (search) {

                    url +=
                        `&search=${encodeURIComponent(search)}`;

                }


                const response =
                    await fetch(url);


                const data =
                    await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.message ||
                        "Failed to load information"
                    );

                }


                renderNews(data.articles || []);


                status.textContent =
                    `Showing ${data.articles.length} live articles`;

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "Unable to load live information.";

                grid.innerHTML = "";

                noResults.style.display = "block";

            }

        }


        // ==============================================
        // RENDER NEWS
        // ==============================================

        function renderNews(articles) {

            const grid =
                document.getElementById("newsGrid");

            const noResults =
                document.getElementById("noResults");


            grid.innerHTML = "";


            if (!articles.length) {

                noResults.style.display = "block";

                return;

            }


            noResults.style.display = "none";


            articles.forEach(article => {

                const card =
                    document.createElement("article");

                card.className =
                    "news-card";


                const category =
                    article.category || "Latest";


                const date =
                    article.publishedAt
                        ? formatDate(article.publishedAt)
                        : "Latest";


                const description =
                    cleanText(
                        article.description ||
                        "Read the full article for more information."
                    );


                card.innerHTML = `

                    <div class="news-top">

                        <span class="news-category">
                            ${escapeHTML(category)}
                        </span>

                        <span class="news-time">
                            ${escapeHTML(date)}
                        </span>

                    </div>


                    <h3>
                        ${escapeHTML(article.title)}
                    </h3>


                    <p>
                        ${escapeHTML(
                            description.substring(0, 180)
                        )}
                        ${description.length > 180 ? "..." : ""}
                    </p>


                    <div class="news-bottom">

                        <a
                            class="read-btn"
                            href="${safeURL(article.link)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Read More →
                        </a>

                    </div>

                `;


                grid.appendChild(card);

            });

        }


        // ==============================================
        // CATEGORY BUTTONS
        // ==============================================

        document
            .querySelectorAll(".category-btn")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(".category-btn")
                            .forEach(btn =>
                                btn.classList.remove("active")
                            );


                        button.classList.add("active");


                        currentCategory =
                            button.dataset.category;


                        loadNews();

                    }
                );

            });


        // ==============================================
        // SEARCH
        // ==============================================

        let searchTimer;


        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                () => {

                    clearTimeout(searchTimer);

                    searchTimer =
                        setTimeout(
                            loadNews,
                            600
                        );

                }
            );


        // ==============================================
        // REFRESH
        // ==============================================

        document
            .getElementById("refreshBtn")
            .addEventListener(
                "click",
                loadNews
            );


        // ==============================================
        // HELPERS
        // ==============================================

        function formatDate(dateString) {

            const date =
                new Date(dateString);

            if (isNaN(date.getTime())) {
                return "Latest";
            }

            return date.toLocaleString(
                "en-IN",
                {
                    day: "2-digit",
                    month: "short",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }


        function cleanText(text) {

            return text
                .replace(/<[^>]*>/g, "")
                .replace(/&nbsp;/g, " ")
                .replace(/&amp;/g, "&")
                .replace(/&quot;/g, '"')
                .trim();

        }


        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                String(text || "");

            return div.innerHTML;

        }


        function safeURL(url) {

            try {

                const parsed =
                    new URL(url);

                if (
                    parsed.protocol === "http:" ||
                    parsed.protocol === "https:"
                ) {
                    return parsed.href;
                }

            } catch (error) {}

            return "#";

        }


        // ==============================================
        // INITIAL LOAD
        // ==============================================

        loadNews();

    </script>

</body>
</html>
